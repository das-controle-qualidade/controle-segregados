<!doctype html>
<html lang="pt-BR" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAS — Controle de Segregados</title>
<!--
  PROTÓTIPO OFFLINE — Controle de peças segregadas / sucata (sem retrabalho)
  - Arquivo único: abrir direto no navegador (Chrome, Edge ou Firefox). Não usa internet.
  - Login DEMONSTRATIVO, sem segurança real.
  - Dados salvos somente neste navegador (IndexedDB), sem compartilhamento entre usuários.
  - Dados de exemplo FICTÍCIOS: ver função buildDemoState() no script. Para usar dados reais,
    use Administração > "Remover somente dados DEMO" / "Restaurar backup (JSON)".
-->
<style>
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#f5f7fa;--border:#dbe2ea;--text:#17212b;--muted:#5b6978;
  --primary:#1f5a8f;--primary-ink:#ffffff;--accent:#f2a900;--accent-ink:#1c1400;--danger:#b93a2e;--ok:#1d8a57;
  --side:#141b23;--side-text:#c7d1db;--side-muted:#7f8d9b;--side-active:#22303e;
  --bar:#2f6fae;--bar2:#f2a900;--track:#e7ecf2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);--radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1218;--surface:#151c25;--surface2:#1a232e;--border:#2a3644;--text:#e5ebf1;--muted:#94a2b1;
  --primary:#4b92d6;--side:#090d12;--side-active:#1a2633;--bar:#4b92d6;--track:#232e3b;--shadow:none;color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
small{color:var(--muted)}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,
    radial-gradient(1200px 600px at 20% 10%,#2b3d52 0%,transparent 60%),
    linear-gradient(160deg,#18222e 0%,#0c1117 70%);color:#e9eef3}
#login .scene{position:absolute;left:0;right:0;bottom:0;height:46vh;min-height:220px;pointer-events:none;opacity:.9}
#login .scene svg{width:100%;height:100%;display:block}
#login .hazard{position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(-45deg,#f2a900 0 18px,#14181d 18px 36px)}
.login-wrap{position:relative;z-index:1;width:100%;max-width:980px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.das-chip{background:#fff;border-radius:12px;padding:8px 14px;display:inline-flex;align-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.das-chip img{height:46px;width:auto;display:block}
.das-chip.sm{padding:5px 8px;border-radius:9px;box-shadow:none}.das-chip.sm img{height:24px}
.rpt-logo{height:42px;width:auto;display:block;margin-bottom:6px}
.login-intro .logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo-mark{width:44px;height:44px;border-radius:10px;background:#f2a900;display:grid;place-items:center;color:#1c1400;flex:none}
.login-intro h1{font-size:34px;line-height:1.1;margin-bottom:12px}
.login-intro p{color:#b6c3d0;font-size:15px;max-width:440px}
.login-card{background:rgba(18,25,33,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.login-card h2{font-size:20px;margin-bottom:18px}
.login-card label{display:block;font-size:13px;color:#b6c3d0;margin:12px 0 6px}
.login-card input,.login-card select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #33414f;background:#0e151c;color:#eef3f7;outline:none}
.login-card input:focus,.login-card select:focus{border-color:#f2a900;box-shadow:0 0 0 3px rgba(242,169,0,.2)}
.login-card .btn-primary{width:100%;margin-top:18px;padding:12px;background:#f2a900;color:#1c1400;border-color:#f2a900;font-weight:650}
.login-err{color:#ff8a7a;font-size:13px;margin-top:10px;min-height:18px}
.demo-box{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(242,169,0,.1);border:1px solid rgba(242,169,0,.35);font-size:12.5px;color:#f5deaa}
.demo-box strong{display:block;color:#f2c14e;margin-bottom:4px}
.demo-box code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;color:#fff;cursor:pointer}
.login-top{position:absolute;top:16px;inset-inline-end:16px;z-index:2;display:flex;align-items:center;gap:8px}
.login-top select{padding:7px 10px;border-radius:8px;border:1px solid #33414f;background:#0e151c;color:#eef3f7}

/* ---------- APP SHELL ---------- */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.side .brand .logo-mark{width:36px;height:36px;border-radius:9px}
.side .brand b{display:block;color:#fff;font-size:14px;line-height:1.2}
.side .brand span{font-size:11.5px;color:var(--side-muted)}
.side nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.side nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--side-text);text-decoration:none;font-weight:500}
.side nav a:hover{background:rgba(255,255,255,.05)}
.side nav a.active{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
[dir=rtl] .side nav a.active{box-shadow:inset -3px 0 0 var(--accent)}
.side nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px}
.side .who b{color:#fff;display:block}
.side .who button{margin-top:8px;width:100%}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);max-width:210px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:9px 24px;background:#fff6dd;color:#5a4300;border-bottom:1px solid #f0dc9c;font-size:13px}
@media (prefers-color-scheme:dark){.banner{background:#2a2310;color:#f1d98f;border-color:#4a3d14}}
.banner svg{flex:none;margin-top:2px}
#view{padding:22px 24px 40px;max-width:1400px;width:100%}

/* ---------- COMPONENTS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.side .btn{background:transparent;color:var(--side-text);border-color:rgba(255,255,255,.14)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:550;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--border)}
.seg button.on{background:var(--primary);color:#fff}
.period-label{font-weight:650;font-size:15px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:0;border-color:var(--primary)}
textarea{resize:vertical;min-height:80px;width:100%}
.kpi{position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:30px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--bar)}
.kpi.k2::before{background:var(--accent)}
.kpi.k3::before{background:var(--ok)}
.kpi.k4::before{background:#8a63c9}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;background:#fde9b0;color:#6a4b00;vertical-align:middle}
.badge.gray{background:var(--track);color:var(--muted)}
.badge.green{background:#d6f2e3;color:#0f5c37}
.badge.blue{background:#dceafa;color:#174a7a}
@media (prefers-color-scheme:dark){.badge{background:#4a3a0c;color:#f5d27a}.badge.green{background:#123d29;color:#8fe0b5}.badge.blue{background:#16304a;color:#9cc7f2}}
.note{font-size:12.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}

/* charts */
.vchart{position:relative;height:250px;padding-inline-start:48px;padding-bottom:26px}
.vgrid{position:absolute;inset:0 0 26px 48px}
[dir=rtl] .vgrid{inset:0 48px 26px 0}
.vgrid div{position:absolute;left:0;right:0;border-top:1px dashed var(--border)}
.vgrid span{position:absolute;inset-inline-end:calc(100% + 6px);top:-8px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vbars{position:relative;height:100%;display:flex;align-items:flex-end;gap:3px}
.vb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.vb-bar{width:100%;max-width:46px;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px;transition:filter .15s}
.vb.hl .vb-bar{background:var(--accent)}
.vb:hover .vb-bar{filter:brightness(1.15)}
.vb-x{position:absolute;bottom:-22px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center}
.hb-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-track{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.hb-fill{height:100%;background:var(--bar);border-radius:7px}
.hb.alt .hb-fill{background:var(--accent)}
.hb-val{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;text-align:end;min-width:64px}
.hb-val small{display:block;font-weight:400;font-size:11px}

/* tables */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:var(--surface2);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface2)}
td .row-actions{display:flex;gap:6px;justify-content:flex-end}
.clip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* forms */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;min-width:0}
.field>label{font-size:12.5px;font-weight:600;margin-bottom:5px}
.field>label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.calc{font-size:22px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--surface2);border:1px dashed var(--border);font-variant-numeric:tabular-nums}
.section-title{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:6px}
.form-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px}
.photo-drop{border:2px dashed var(--border);border-radius:10px;padding:12px;background:var(--surface2)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{position:relative;width:92px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#000;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1;padding:0}
.seg-inline{display:flex;gap:8px}
.seg-inline label{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface)}
.seg-inline input{accent-color:var(--primary)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,12,16,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal-card{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--border)}
.modal-card.wide{max-width:960px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;flex:1}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border)}
.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.dl div{min-width:0}
.dl dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.dl dd{margin:2px 0 0;font-weight:550;overflow-wrap:anywhere}
.dl .full{grid-column:1/-1}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo-grid figure{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:zoom-in;background:#000}
.photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.photo-grid figcaption{font-size:11.5px;padding:5px 8px;background:var(--surface);color:var(--muted)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#17212b;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:13.5px}
.toast.err{background:var(--danger)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;line-height:1;padding:0 4px}
.inline-add{display:flex;gap:8px;flex-wrap:wrap}
.inline-add input,.inline-add select{flex:1;min-width:120px}
.stat-row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:14px}
.stat-row div b{display:block;font-size:20px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.limits{border-inline-start:4px solid var(--accent)}
.limits ul{margin:6px 0 0;padding-inline-start:18px}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:0;height:auto;z-index:10;flex-direction:row;flex-wrap:wrap;align-items:center}
  .side .brand{border:0;padding:10px 16px;flex:1}
  .side .brand span{display:none}
  .side .who{border:0;padding:8px 16px;display:flex;gap:8px;align-items:center}
  .side .who b,.side .who small{display:none}
  .side .who button{margin:0;width:auto}
  .side nav{order:3;flex-direction:row;overflow-x:auto;width:100%;padding:6px 8px;flex:none}
  .side nav a{white-space:nowrap;padding:8px 10px}
  .side nav a.active{box-shadow:inset 0 -3px 0 var(--accent)}
  .topbar{position:static;padding:12px 16px}
  .banner{padding:9px 16px}
  #view{padding:16px 16px 32px}
  .g2{grid-template-columns:1fr}
  .login-wrap{grid-template-columns:1fr;gap:24px;max-width:440px}
  .login-intro h1{font-size:26px}
  .dl{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr}
  .kpi .val{font-size:22px}
  .form-grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .hb{grid-template-columns:1fr auto}
  .hb-track{grid-column:1/-1;order:3}
  .vchart{padding-inline-start:40px}
  .vgrid{left:40px}
  .toolbar>*{flex:1 1 auto}
  .topbar select{max-width:150px}
}

/* ---------- HISTÓRICO POR MÊS E SEMANA ---------- */
.monthbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.monthbar button,.wk{border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;color:var(--text);display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.monthbar button b{text-transform:capitalize}
.monthbar small,.wk small{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.monthbar button.on,.wk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.monthbar button.on small,.wk.on small{color:#e6eef7}
/* situação do mês: verde = 4 semanas lançadas, amarelo = parte, normal = nada */
.monthbar button.st-full,.wk.st-full{background:#d8f3e4;border-color:#1d8a57;color:#0f4d30}
.monthbar button.st-part{background:#fdefc0;border-color:#d4a514;color:#5c4400}
.monthbar button.st-full small,.wk.st-full small{color:#22643f}.monthbar button.st-part small{color:#7a5c00}
.monthbar button.on.st-full,.monthbar button.on.st-part,.wk.on.st-full{outline:3px solid var(--primary);outline-offset:-1px}
.monthbar button.on.st-full,.wk.on.st-full{background:#d8f3e4;color:#0f4d30}.monthbar button.on.st-part{background:#fdefc0;color:#5c4400}
@media (prefers-color-scheme:dark){.monthbar button.st-full,.wk.st-full,.monthbar button.on.st-full,.wk.on.st-full{background:#123d29;color:#b9f0d2;border-color:#2fa86b}.monthbar button.st-part,.monthbar button.on.st-part{background:#3d300c;color:#f5dd94;border-color:#c99a18}.monthbar button.st-full small,.wk.st-full small{color:#8fd6ae}.monthbar button.st-part small{color:#e6c46a}}
.legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend-row i.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border);background:var(--surface2);margin-inline-end:5px;vertical-align:-2px}
.legend-row i.lg.st-full{background:#d8f3e4;border-color:#1d8a57}.legend-row i.lg.st-part{background:#fdefc0;border-color:#d4a514}
.weekbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk{padding:10px;text-align:start;align-items:flex-start}
.wk .btn{margin-top:6px}
@media (max-width:900px){.monthbar{grid-template-columns:repeat(6,minmax(0,1fr))}.weekbar{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.monthbar{grid-template-columns:repeat(4,minmax(0,1fr))}.weekbar{grid-template-columns:1fr}}
/* ---------- RELATÓRIO PROFISSIONAL ---------- */
.rpt{background:#fff;color:#16202a;padding:18px;border-radius:8px;font-size:12px}
.rpt h1{font-size:20px;margin:2px 0 4px;color:#16202a}.rpt h4{margin:16px 0 6px;font-size:13px;color:#1f5a8f;text-transform:uppercase;letter-spacing:.04em}
.rpt-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #1f5a8f;padding-bottom:10px;margin-bottom:12px}
.rpt-co{font-weight:700;color:#1f5a8f;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.rpt-meta{font-size:11.5px;line-height:1.6;text-align:end}
.rpt-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.rpt-kpis div{border:1px solid #cfd8e2;border-inline-start:4px solid #1f5a8f;border-radius:6px;padding:8px 10px}
.rpt-kpis span{display:block;font-size:10.5px;color:#5b6978;text-transform:uppercase}.rpt-kpis b{font-size:17px}
.rpt-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rpt table{width:100%;border-collapse:collapse;font-size:11px}
.rpt th{background:#1f5a8f;color:#fff;text-transform:none;letter-spacing:0;font-size:10.5px;position:static;padding:6px}
.rpt td{border-bottom:1px solid #dfe5eb;padding:5px 6px;color:#16202a}
.rpt tbody tr:nth-child(even) td{background:#f4f7fa}
.rpt tfoot td{font-weight:700;background:#e8eef5;color:#16202a}
.rpt-note{font-size:10.5px;color:#5b6978;margin-top:10px}
.rpt-sign{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:40px;text-align:center;font-size:11px}
.rpt-sign div{border-top:1px solid #16202a;padding-top:6px}
.rpt-foot{margin-top:18px;font-size:10px;color:#8796a5;text-align:center}
@media (max-width:700px){.rpt-kpis{grid-template-columns:1fr 1fr}.rpt-two{grid-template-columns:1fr}.rpt-meta{text-align:start}}

/* ---------- PRINT ---------- */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.print-rpt .modal-body{padding:0}
  body.print-rpt .rpt{padding:0}
  body.print-rpt .rpt tr{break-inside:avoid}
  body{background:#fff;color:#000}
  .side,.topbar,.banner,.toolbar,.no-print,.pager,#toast{display:none!important}
  #app{display:block}
  .card{box-shadow:none;break-inside:avoid}
  body.print-modal #app{display:none!important}
  body.print-modal .modal{position:static;background:none;padding:0}
  body.print-modal .modal-card{box-shadow:none;border:0;max-width:none}
  body.print-modal .modal-foot,body.print-modal .modal-head button{display:none}
}
.wk.locked{background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--surface) 8px 16px)}.wk .lockmsg{color:#b42318;font-weight:700}
.kpi.vivid{color:#fff;border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.kpi.vivid:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.kpi.vivid::before{display:none}.kpi.vivid .lbl,.kpi.vivid .sub{color:rgba(255,255,255,.9)}
.kpi.vivid.k2{background:linear-gradient(135deg,#b91c1c,#ef4444)}.kpi.vivid.k3{background:linear-gradient(135deg,#c2410c,#f59e0b)}.kpi.vivid.k4{background:linear-gradient(135deg,#6d28d9,#a855f7)}
.kpi.vivid.k5{background:linear-gradient(135deg,#047857,#10b981)}.kpi.vivid.k6{background:linear-gradient(135deg,#be185d,#f472b6)}.kpi.vivid:not([data-kgo]){cursor:default}
.kpi.vivid .sub *{color:#fff!important;font-weight:700}
.vchart[style*="--vb"] .vb-bar{background:linear-gradient(180deg,var(--vb),color-mix(in srgb,var(--vb) 65%,#000))}
.vb-v{font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;margin-bottom:2px;line-height:1}
.vchart.dense .vb-v{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;margin-bottom:3px}
.ask-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}.ask-ov .modal-card{max-width:480px;width:100%}
</style>
</head>

<script>
'use strict';
/* ================= NUVEM (Supabase, mesmo projeto do QC) =================
   Cada item do sistema é uma linha em seg_docs. A cada gravação, compara o estado com a última
   cópia sincronizada e envia só o que mudou. Fotos ficam no Storage "fotos", pasta seg/.
   A chave publicável pode ficar no site: os dados são protegidos pelas regras (RLS) do banco. */
const ONLINE=true;
const SB_URL='https://bkbtgbygrvbyjfzdrlxi.supabase.co',SB_KEY='sb_publishable_OEzNjc6AryDINoRad9dtxA_bjlkl2NW';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const CLOUD={snap:new Map(),hasPass:false,people:[],session:Math.random().toString(36).slice(2),ch:null,queue:[],timer:null,ready:false};
const C_ARR=['occurrences','products','clients','costs','costImports','costLog','closureLog','authLog'],C_MAP=['closures','weekDone'],C_LIST=['problems','destinations'];
const C_NEWEST=['costImports','costLog','closureLog','authLog'];
const FOTO_SEG=7*24*3600;
const sbOk=r=>{if(r&&r.error)throw r.error;return r};
/* no banco a foto guarda só o caminho; o link temporário (assinado) existe apenas na memória */
const occDoc=o=>Object.assign({},o,{photos:(o.photos||[]).map(p=>p.path?{id:p.id,kind:p.kind,name:p.name,path:p.path,size:p.size}:p)});
function docOf(col,item){return col==='occurrences'?occDoc(item):item}
function toDocs(s){const m=new Map(),put=(col,id,dados)=>m.set(col+'|'+id,{col,id:String(id),dados,j:JSON.stringify(dados)});
  C_ARR.forEach(c=>(s[c]||[]).forEach(x=>{if(!x.id)x.id=uid();put(c,x.id,docOf(c,x))}));
  C_MAP.forEach(c=>Object.keys(s[c]||{}).forEach(k=>put(c,k,s[c][k])));
  C_LIST.forEach(c=>(s[c]||[]).forEach(v=>put(c,v,{v})));
  const st=Object.assign({},s.settings);delete st.authPassword;put('settings','settings',st);return m}
function sortNewest(s){C_NEWEST.forEach(c=>s[c].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))))}
function fromDocs(rows){const s={app:'segregados-prototipo',version:3,settings:{},users:[],reopenCodes:[]};C_ARR.forEach(c=>s[c]=[]);C_MAP.forEach(c=>s[c]={});C_LIST.forEach(c=>s[c]=[]);
  rows.forEach(r=>{if(C_ARR.includes(r.col))s[r.col].push(r.dados);else if(C_MAP.includes(r.col))s[r.col][r.id]=r.dados;else if(C_LIST.includes(r.col))s[r.col].push(r.dados.v);else if(r.col==='settings')s.settings=r.dados});
  sortNewest(s);return s}
async function signPhotos(list){const ps=[];list.forEach(o=>(o.photos||[]).forEach(p=>{if(p.path)ps.push(p.path)}));const urls={};
  for(let i=0;i<ps.length;i+=500){const r=sbOk(await sb.storage.from('fotos').createSignedUrls(ps.slice(i,i+500),FOTO_SEG));(r.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
  list.forEach(o=>(o.photos||[]).forEach(p=>{if(p.path)p.data=urls[p.path]||''}))}
async function fetchDocs(){const rows=[];for(let from=0;;from+=1000){const r=sbOk(await sb.from('seg_docs').select('col,id,dados').order('col').order('id').range(from,from+999));rows.push(...(r.data||[]));if((r.data||[]).length<1000)return rows}}
function dataBlob(d){const i=d.indexOf(','),mime=(/^data:([^;,]+)/.exec(d)||[])[1]||'image/jpeg',b=atob(d.slice(i+1)),a=new Uint8Array(b.length);for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);return new Blob([a],{type:mime})}
async function uploadPhotos(){for(const o of state.occurrences)for(const p of o.photos||[])if(!p.path&&/^data:image\/[^;]+;base64,/.test(p.data||'')){const bl=dataBlob(p.data),path='seg/'+o.id+'-'+p.id+'.jpg';
    sbOk(await sb.storage.from('fotos').upload(path,bl,{upsert:true,contentType:bl.type}));p.path=path;p.size=bl.size}}
const pathsOf=m=>{const out=new Set();m.forEach(d=>{if(d.col==='occurrences')(d.dados.photos||[]).forEach(p=>{if(p.path)out.add(p.path)})});return out};
async function cloudFlush(){await uploadPhotos();const docs=toDocs(state),up=[],del={};
  docs.forEach((d,k)=>{const old=CLOUD.snap.get(k);if(!old||old.j!==d.j)up.push({col:d.col,id:d.id,dados:d.dados,origem:CLOUD.session})});
  CLOUD.snap.forEach((d,k)=>{if(!docs.has(k))(del[d.col]=del[d.col]||[]).push(d.id)});
  for(let i=0;i<up.length;i+=200)sbOk(await sb.from('seg_docs').upsert(up.slice(i,i+200)));
  for(const c in del)for(let i=0;i<del[c].length;i+=100)sbOk(await sb.from('seg_docs').delete().eq('col',c).in('id',del[c].slice(i,i+100)));
  const now=pathsOf(docs),gone=[...pathsOf(CLOUD.snap)].filter(p=>!now.has(p));CLOUD.snap=docs;
  if(gone.length)await sb.storage.from('fotos').remove(gone).catch(()=>{})}
let cloudChain=Promise.resolve();
function cloudPersist(){cloudChain=cloudChain.then(cloudFlush).catch(e=>{console.warn(e);toast(t('cloudSaveErr'),true)});return cloudChain}
/* mudanças feitas por outras pessoas chegam em tempo real */
function cloudApply(ev){const row=ev.new&&ev.new.col?ev.new:ev.old,col=row.col,id=row.id,del=ev.eventType==='DELETE',k=col+'|'+id;
  if(C_ARR.includes(col)){const a=state[col],i=a.findIndex(x=>String(x.id)===id);if(del){if(i>=0)a.splice(i,1)}else if(i>=0)a[i]=row.dados;else a.push(row.dados)}
  else if(C_MAP.includes(col)){if(del)delete state[col][id];else state[col][id]=row.dados}
  else if(C_LIST.includes(col)){const i=state[col].indexOf(id);if(del){if(i>=0)state[col].splice(i,1)}else if(i<0)state[col].push(id)}
  else if(col==='settings'&&!del)state.settings=Object.assign({},row.dados,{requireScalePhoto:false});
  if(del)CLOUD.snap.delete(k);else{const dados=col==='settings'?(()=>{const x=Object.assign({},state.settings);delete x.authPassword;return x})():C_ARR.includes(col)?docOf(col,state[col].find(x=>String(x.id)===id)):row.dados;CLOUD.snap.set(k,{col,id,dados,j:JSON.stringify(dados)})}}
async function cloudDrain(){const q=CLOUD.queue;CLOUD.queue=[];CLOUD.timer=null;await cloudChain;q.forEach(cloudApply);sortNewest(state);
  await signPhotos(q.filter(e=>e.new&&e.new.col==='occurrences').map(e=>state.occurrences.find(o=>o.id===e.new.id)).filter(Boolean)).catch(()=>{});
  const typing=route().name==='new'||!$('#modal').hidden||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');if(currentUser&&!typing)renderShell()}
function cloudListen(){CLOUD.ch=sb.channel('seg_docs').on('postgres_changes',{event:'*',schema:'public',table:'seg_docs'},ev=>{if(ev.new&&ev.new.origem===CLOUD.session)return;CLOUD.queue.push(ev);if(!CLOUD.timer)CLOUD.timer=setTimeout(cloudDrain,700)}).subscribe()}
async function cloudProfile(u){const [pf,pp]=await Promise.all([sb.from('perfis').select('nome,papel').eq('id',u.id).maybeSingle().then(sbOk),sb.from('seg_papeis').select('papel').eq('id',u.id).maybeSingle().then(sbOk)]);
  const admin=pf.data&&pf.data.papel==='admin',papel=pp.data&&pp.data.papel;return {id:u.id,username:u.email,name:(pf.data&&pf.data.nome)||u.email,role:papel==='blocked'?'blocked':admin?'admin':papel||'viewer'}}
async function cloudEnter(u){$('#loginErr').textContent=t('cloudLoading');currentUser=null;const me=await cloudProfile(u);if(me.role==='blocked'){await sb.auth.signOut();$('#loginErr').textContent=t('cloudBlocked');return}const rows=await fetchDocs();CLOUD.hasPass=!!sbOk(await sb.rpc('seg_senha_definida')).data;
  if(!rows.length&&me.role==='admin'){state=buildDemoState();state.users=[];delete state.settings.authPassword;currentUser=me;CLOUD.snap=new Map();await uploadPhotos();await cloudFlush()}
  else if(!rows.length){state=null;state=emptyState(false);state.users=[];delete state.settings.authPassword;CLOUD.snap=toDocs(state)}
  else{state=migrate(fromDocs(rows));state.settings.requireScalePhoto=false;delete state.settings.authPassword;await signPhotos(state.occurrences);CLOUD.snap=toDocs(state)}
  currentUser=me;CLOUD.ready=true;if(!CLOUD.ch)cloudListen();$('#loginErr').textContent='';$('#lp').value='';enterApp();backupReminder()}
async function cloudLogin(email,pass){$('#loginErr').textContent=t('cloudLoading');const r=await sb.auth.signInWithPassword({email,password:pass});if(r.error){$('#loginErr').textContent=t('loginError');return}
  try{await cloudEnter(r.data.user)}catch(e){console.warn(e);$('#loginErr').textContent=t('cloudLoadErr')}}
async function cloudLogout(){if(CLOUD.ch){await sb.removeChannel(CLOUD.ch);CLOUD.ch=null}await sb.auth.signOut();state=null;CLOUD.snap=new Map()}
async function cloudInit(){$('#lu').type='email';$('#lu').autocomplete='email';$('.demo-box').hidden=true;$('.demo-box').style.display='none';
  const labels=$('label[for=lu]');if(labels)labels.textContent=t('cloudEmail');$('#lu').placeholder=t('cloudEmail');
  const {data}=await sb.auth.getSession();if(data&&data.session){try{await cloudEnter(data.session.user)}catch(e){console.warn(e);$('#loginErr').textContent=t('cloudLoadErr')}}}
/* backup com as fotos dentro do arquivo */
async function cloudBackupState(){const s=JSON.parse(JSON.stringify(state));delete s.settings.authPassword;s.users=[{id:'u1',username:'admin',password:'',name:'Administrador',role:'admin'}];
  for(const o of s.occurrences)for(const p of o.photos||[])if(p.path&&p.data){try{const b=await (await fetch(p.data)).blob();p.data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});delete p.path;delete p.size}catch(e){}}
  return s}
/* Administração: as contas são as mesmas do QC. Remover tira o acesso só deste sistema. */
async function peopleLoad(){const [a,b]=await Promise.all([sb.from('perfis').select('id,email,nome,papel').order('nome').then(sbOk),sb.from('seg_papeis').select('id,papel').then(sbOk)]);const m={};(b.data||[]).forEach(x=>m[x.id]=x.papel);
  CLOUD.people=(a.data||[]).map(p=>({id:p.id,email:p.email,nome:p.nome,qcAdmin:p.papel==='admin',role:m[p.id]==='blocked'?'blocked':p.papel==='admin'?'admin':m[p.id]||'viewer'}))}
function adminUsers(body){return sb.functions.invoke('admin-usuarios',{body}).then(async r=>{if(!r.error)return r.data;const c=r.error.context,j=c&&c.json?await c.json().catch(()=>({})):{};throw new Error(j.error||r.error.message)})}
const setPapel=(id,papel)=>sb.from('seg_papeis').upsert({id,papel}).then(sbOk);
function peopleCard(){if(!CLOUD.peopleLoaded){CLOUD.peopleLoaded=true;peopleLoad().then(()=>{if(route().name==='admin')renderAdmin()}).catch(e=>{console.warn(e);toast(t('cloudLoadErr'),true)})}
  const opt=(p,v)=>`<option value="${v}" ${p.role===v?'selected':''}>${esc(roleLabel(v))}</option>`;
  const row=p=>`<tr style="${p.role==='blocked'?'opacity:.65':''}"><td>${esc(p.email)}</td><td>${esc(p.nome)}</td><td>${p.role==='admin'?esc(roleLabel('admin')):`<select data-prole="${p.id}">${opt(p,'operator')}${opt(p,'viewer')}${opt(p,'blocked')}</select>`}</td><td><div class="row-actions"><button class="btn btn-sm" data-ppw="${p.id}">🔑 ${esc(t('uPass'))}</button>${p.id===currentUser.id||p.role==='blocked'?'':`<button class="btn btn-sm btn-danger" data-prm="${p.id}">${esc(t('remove'))}</button>`}</div></td></tr>`,head=`<thead><tr><th>${esc(t('cloudEmail'))}</th><th>${esc(t('name'))}</th><th>${esc(t('role'))}</th><th></th></tr></thead>`,off=CLOUD.people.filter(p=>p.role==='blocked');
  return `<div class="card" style="grid-column:1/-1"><h3>${esc(t('users'))}</h3><div class="table-wrap" style="margin-bottom:12px"><table>${head}<tbody>${CLOUD.people.filter(p=>p.role!=='blocked').map(row).join('')}</tbody></table></div>
   ${off.length?`<details style="margin-bottom:12px"><summary class="note" style="cursor:pointer;font-weight:600">${esc(t('uBlocked'))} (${off.length})</summary><div class="table-wrap" style="margin-top:8px"><table>${head}<tbody>${off.map(row).join('')}</tbody></table></div></details>`:''}
   <form class="inline-add" id="pAdd"><input name="nome" placeholder="${esc(t('name'))}" required><input name="email" type="email" placeholder="${esc(t('cloudEmail'))}" required autocomplete="off"><input name="senha" type="password" minlength="8" placeholder="${esc(t('password'))}" required autocomplete="new-password"><select name="papel"><option value="operator">${esc(roleLabel('operator'))}</option><option value="viewer">${esc(roleLabel('viewer'))}</option></select><button class="btn btn-primary">${esc(t('addUser'))}</button></form>
   <p class="hint">${esc(t('cloudUsersNote'))}</p></div>`}
function bindPeople(){const reload=async()=>{await peopleLoad();renderAdmin()};
  $$('[data-prole]').forEach(s=>s.onchange=async()=>{try{await setPapel(s.dataset.prole,s.value);await reload();toast(t('savedOk'))}catch(e){console.warn(e);toast(t('cloudSaveErr'),true)}});

  const f=$('#pAdd');if(f)f.onsubmit=async e=>{e.preventDefault();const btn=$('button',f);btn.disabled=true;try{const r=await adminUsers({acao:'criar',email:f.email.value.trim(),senha:f.senha.value,nome:f.nome.value.trim(),papel:'user'});await setPapel(r.id,f.papel.value);await reload();toast(t('uAdded'))}catch(err){toast(err.message||t('cloudSaveErr'),true);btn.disabled=false}}}

<script>

/* ================= ARMAZENAMENTO LOCAL (IndexedDB) ================= */
const Store={db:null,
  open(){return new Promise((res,rej)=>{try{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('segregados-prototipo-offline',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  get(k){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readonly').objectStore('kv').get(k);tx.onsuccess=()=>res(tx.result);tx.onerror=()=>rej(tx.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};

/* ================= DADOS DE DEMONSTRAÇÃO (FICTÍCIOS) =================
   Substitua por dados reais: Administração > "Remover somente dados DEMO"
   e cadastre/importe os dados reais (ou restaure um backup JSON).            */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function demoPhoto(kind,label,hue){
  const defect=kind==='defect';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},18%,30%)"/><stop offset="1" stop-color="hsl(${hue},20%,14%)"/></linearGradient><linearGradient id="m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d0d6"/><stop offset="1" stop-color="#7d868f"/></linearGradient></defs><rect width="640" height="480" fill="url(#g)"/><path d="M150 330 L230 150 L470 150 L520 330 Z" fill="url(#m)" stroke="#3a4148" stroke-width="6"/><rect x="250" y="200" width="160" height="70" rx="10" fill="#5e676f"/><circle cx="200" cy="300" r="16" fill="#3a4148"/><circle cx="470" cy="300" r="16" fill="#3a4148"/>${defect?'<circle cx="430" cy="215" r="58" fill="none" stroke="#ff3b30" stroke-width="10"/><path d="M405 200 l20 12 -14 10 22 14" fill="none" stroke="#ff3b30" stroke-width="6"/>':''}${kind==='scale'?'<rect x="150" y="340" width="340" height="40" rx="6" fill="#2b3138"/><rect x="240" y="390" width="160" height="44" rx="6" fill="#0d1a12"/><text x="320" y="422" text-anchor="middle" font-family="monospace" font-size="28" fill="#5cff8a">'+(10+label.length%30)+',4 kg</text>':''}<rect x="0" y="0" width="640" height="54" fill="rgba(242,169,0,.92)"/><text x="20" y="36" font-family="Arial" font-size="26" font-weight="700" fill="#1c1400">FOTO DEMO · ${kind==='scale'?'BALANÇA':defect?'DEFEITO':'PRODUTO'}</text><text x="20" y="455" font-family="Arial" font-size="22" fill="#fff">${esc(label)}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function buildDemoState(){
  const r=rng(20261026);const pick=a=>a[Math.floor(r()*a.length)];
  const wpick=(a,w)=>{let x=r()*w.reduce((s,v)=>s+v,0);for(let i=0;i<a.length;i++){x-=w[i];if(x<=0)return a[i]}return a[a.length-1]};
  const base={};
  const products=[['DEMO-1001','Suporte lateral LH (demo)',12.5,1.8],['DEMO-1002','Suporte lateral RH (demo)',12.5,1.8],['DEMO-2001','Travessa dianteira (demo)',38.9,4.2],['DEMO-2002','Travessa traseira (demo)',41.3,4.6],['DEMO-3001','Base do assento (demo)',57,6.1],['DEMO-3002','Encosto 60% (demo)',64.8,5.4],['DEMO-3003','Encosto 40% (demo)',49.2,4],['DEMO-4001','Reforço de solda (demo)',8.75,.6]]
    .map(([code,model,c,weight])=>{base[code]=c;return {id:uid()+code,code,model,weight,active:true,demo:true}});
  const clients=[['Cliente Alfa (demo)','client'],['Cliente Beta (demo)','client'],['Cliente Gama (demo)','client'],['Cliente Delta (demo)','client'],['Setor Solda (demo)','internal'],['Setor Montagem (demo)','internal'],['Inspeção Final (demo)','internal']].map(([name,type])=>({id:uid()+name.length,name,type,demo:true}));
  const problems=['Solda fora de posição','Peça invertida','Fora do dimensional','Trinca na solda','Lado LH montado no RH','Amassado / deformação','Furo ausente'];
  const operators=['Operador A (demo)','Operador B (demo)','Operador C (demo)','Operador D (demo)','Operador E (demo)'];
  const descs=['Cliente informou peças sem encaixe na linha de montagem (texto demo).','Peças identificadas na inspeção de recebimento do cliente (texto demo).','Cliente devolveu lote com defeito visual (texto demo).','Reclamação registrada pelo cliente após auditoria (texto demo).'];
  const today=parseISO(todayISO());const start=addDays(today,-430);
  /* custos demo: uma carga inicial e uma planilha do RH só em janeiro do ano atual; os outros meses ficam zerados até importar */
  const costs=[],costImports=[];
  const load=(from,file,sheet,f)=>{const at=from+'T12:00:00.000Z',imp={id:uid(),at,user:'RH (demo)',file,sheet,hash:'demo-'+from,from,rows:products.length,inserted:products.length,updated:0,same:0,ignored:0,filled:0,recalc:0,demo:true};
    costImports.unshift(imp);products.forEach(p=>{base[p.code]=round2(base[p.code]*f());costs.push({id:uid(),code:p.code,model:p.model,cost:base[p.code],from,importId:imp.id,at,demo:true})})};
  const y0=start.getUTCFullYear()+'-01-01',jan=today.getUTCFullYear()+'-01-01';
  load(y0,'carga-inicial-demo.xlsx','Carga inicial (demo)',()=>1);
  if(jan>y0)load(jan,'custos-rh-janeiro-demo.xlsx','Janeiro',()=>1+(r()*.06-.02));
  const occ=[];
  for(let d=new Date(start);d<=today;d=addDays(d,1)){
    const wd=d.getUTCDay();let n=0;const p=wd===0?.08:wd===6?.2:.55;
    if(r()<p)n=1;if(r()<p*.35)n++;if(toISO(d)===toISO(today))n=2;
    for(let i=0;i<n;i++){
      const prod=wpick(products,[5,4,3,3,2,2,2,6]);const cli=wpick(clients,[5,3,2,1,4,3,2]);
      const qty=Math.max(1,Math.round(Math.pow(r(),1.8)*45)+1);const date=toISO(d);
      const resp=wpick(RESP,[35,25,30,10]);const photos=[],hue=(prod.code.charCodeAt(5)*37)%360,lab=prod.code+' · '+prod.model;
      if(r()<.6)photos.push({id:uid(),kind:'product',name:'demo-produto.svg',data:demoPhoto('product',lab,hue)});
      if(r()<.6)photos.push({id:uid(),kind:'defect',name:'demo-defeito.svg',data:demoPhoto('defect',lab,hue)});
      if(r()<.5)photos.push({id:uid(),kind:'scale',name:'demo-balanca.svg',data:demoPhoto('scale',lab,hue)});
      const c=costAt(prod.code,date,costs);
      occ.push({id:uid(),seq:0,date,originType:cli.type,client:cli.name,code:prod.code,model:prod.model,problem:pick(problems),operator:wpick(operators,[5,4,3,2,1]),clientDesc:cli.type==='client'?pick(descs):'',qty,unitCost:c.cost,costId:c.id,costFrom:c.from,totalCost:round2(qty*c.cost),destination:'Sucata',costResp:resp,photos,notes:'',createdBy:'Administrador (demo)',createdAt:new Date().toISOString(),demo:true});
    }
  }
  occ.sort((a,b)=>a.date.localeCompare(b.date)).forEach((o,i)=>o.seq=i+1);
  return {app:'segregados-prototipo',version:3,settings:{company:'Empresa Demonstração Ltda.',currency:'BRL',requireScalePhoto:false,authPassword:DEMO_PASS},
    users:[{id:'u1',username:'admin',password:'admin123',name:'Administrador (demo)',role:'admin'},{id:'u2',username:'operador',password:'operador123',name:'Inspetor (demo)',role:'operator'},{id:'u3',username:'lider',password:'lider123',name:'Líder / Analista (demo)',role:'viewer'}],
    clients,problems,destinations:['Sucata'],products,occurrences:occ,costs,costImports,costLog:[],closures:{},closureLog:[],weekDone:{},reopenCodes:[],authLog:[]};
}
function emptyState(keepUsers){return {app:'segregados-prototipo',version:3,settings:Object.assign({company:'',currency:'BRL',requireScalePhoto:false,authPassword:DEMO_PASS},state?state.settings:{}),users:keepUsers&&state?state.users:buildDemoState().users,clients:[],problems:[],destinations:['Sucata'],products:[],occurrences:[],costs:[],costImports:[],costLog:[],closures:{},closureLog:[],weekDone:{},reopenCodes:[],authLog:[]}}
/* completa dados salvos por versões anteriores; o custo do cadastro antigo vira o primeiro preço do histórico */
function migrate(s){
  ['costs','costImports','costLog','closureLog','clients','problems','destinations','products','occurrences'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  if(!s.closures||typeof s.closures!=='object')s.closures={};
  if(!s.weekDone||typeof s.weekDone!=='object')s.weekDone={};if(!Array.isArray(s.reopenCodes))s.reopenCodes=[];
  if(Array.isArray(s.users)&&!s.users.some(u=>u.role==='viewer')&&s.users.some(u=>u.username==='admin'&&u.password==='admin123'))s.users.push({id:'u3',username:'lider',password:'lider123',name:'Líder / Analista (demo)',role:'viewer'});
  s.settings=Object.assign({company:'',currency:'BRL',requireScalePhoto:false,authPassword:DEMO_PASS},s.settings);if(!Array.isArray(s.authLog))s.authLog=[];s.settings.requireScalePhoto=false;
  if((s.version||1)<2){
    if(s.occurrences.every(o=>o.demo)&&s.products.every(p=>p.demo)){const d=buildDemoState();d.users=s.users&&s.users.length?s.users:d.users;d.settings=Object.assign(d.settings,s.settings);return d}
    const at=new Date().toISOString(),imp={id:uid(),at,user:'Sistema',file:'Migração do cadastro de produtos',sheet:'',hash:'migracao',from:'',rows:0,inserted:0,updated:0,same:0,ignored:0,filled:0,recalc:0};
    s.products.forEach(p=>{const k=String(p.code||'').trim().toUpperCase();if(+p.unitCost>0&&!s.costs.some(c=>c.code===k)){const first=s.occurrences.filter(o=>String(o.code||'').trim().toUpperCase()===k).map(o=>o.date).sort()[0]||todayISO();s.costs.push({id:uid(),code:k,model:p.model,cost:+p.unitCost,from:first,importId:imp.id,at,demo:!!p.demo});imp.inserted++}});
    if(imp.inserted){imp.rows=imp.inserted;s.costImports.unshift(imp)}
    s.occurrences.forEach(o=>{if(!('costFrom' in o)){o.costFrom=null;o.costId=null}if(!Array.isArray(o.photos))o.photos=[]});
    s.version=2}
  if(s.version<3){if(s.occurrences.length&&s.occurrences.every(o=>o.demo)&&s.products.every(p=>p.demo)){const d=buildDemoState();d.users=s.users&&s.users.length?s.users:d.users;d.settings=Object.assign(d.settings,s.settings);return d}
    s.version=3}
  return s}

/* ================= I18N APLICAÇÃO ================= */
function fillLangSelect(sel){sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>${c.toUpperCase()} · ${n}</option>`).join('')}

  LANG=I18N[code]?code:'pt-BR';ls.set('seg_lang',LANG);
  document.documentElement.lang=LANG;document.documentElement.dir=RTL.includes(LANG)?'rtl':'ltr';

  $$('[data-close]',m).forEach(b=>b.onclick=closeModal)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.style.overflow='';document.body.classList.remove('print-modal')}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});

  d.innerHTML=`<form class="modal-card" role="alertdialog" aria-modal="true"><div class="modal-body" style="white-space:pre-line">${esc(msg)}${input?'<textarea name="v" rows="3" maxlength="300" style="width:100%;margin-top:10px"></textarea>':''}</div><div class="modal-foot"><span style="flex:1"></span><button type="button" class="btn" data-n>${esc(t('cancel'))}</button><button class="btn btn-primary">OK</button></div></form>`;
  document.body.appendChild(d);const f=$('form',d),end=v=>{d.remove();document.removeEventListener('keydown',esc2,true);res(v)},esc2=e=>{if(e.key==='Escape'){e.stopPropagation();end(input?null:false)}};
  document.addEventListener('keydown',esc2,true);$('[data-n]',d).onclick=()=>end(input?null:false);f.onsubmit=e=>{e.preventDefault();end(input?f.v.value:true)};(input?f.v:$('.btn-primary',d)).focus()})}

const ICONS={
 dashboard:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
 new:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',

/* ================= PERÍODOS ================= */
function periodRange(type,ref){if(type==='range')return {s:ui.rde,e:ui.rate};const d=parseISO(ref);let s,e;
  if(type==='day'){s=e=d}
  else if(type==='week'){s=addDays(d,-((d.getUTCDay()+6)%7));e=addDays(s,6)}
  else if(type==='month'){s=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1));e=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))}
  else{s=new Date(Date.UTC(d.getUTCFullYear(),0,1));e=new Date(Date.UTC(d.getUTCFullYear(),11,31))}
  return {s:toISO(s),e:toISO(e)}}
const rangeDays=()=>Math.round((parseISO(ui.rate)-parseISO(ui.rde))/864e5)+1;
function shiftedRef(dir){const d=parseISO(ui.ref);
  if(ui.period==='day')return toISO(addDays(d,dir));
  if(ui.period==='week')return toISO(addDays(d,7*dir));
  if(ui.period==='month')return toISO(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+dir,1)));
  return toISO(new Date(Date.UTC(d.getUTCFullYear()+dir,0,1)))}
function shiftRef(dir){if(ui.period==='range'){const n=rangeDays()*dir;ui.rde=toISO(addDays(parseISO(ui.rde),n));ui.rate=toISO(addDays(parseISO(ui.rate),n))}else ui.ref=shiftedRef(dir)}
function prevRange(){if(ui.period==='range'){const n=rangeDays();return {s:toISO(addDays(parseISO(ui.rde),-n)),e:toISO(addDays(parseISO(ui.rde),-1))}}return periodRange(ui.period,shiftedRef(-1))}
function periodLabel(){const r=periodRange(ui.period,ui.ref),d=parseISO(ui.ref);
  if(ui.period==='range')return fmtDate(r.s)+' – '+fmtDate(r.e);
  if(ui.period==='day')return fmtDT(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(ui.period==='week')return t('periodWeek')+': '+fmtDate(r.s)+' – '+fmtDate(r.e);
  if(ui.period==='month')return fmtDT(d,{month:'long',year:'numeric'});
  return String(d.getUTCFullYear())}
function evoBuckets(){const d=parseISO(ui.ref),b=[];
  if(ui.period==='range'){if(rangeDays()<=62){for(let x=parseISO(ui.rde);toISO(x)<=ui.rate;x=addDays(x,1))b.push({s:toISO(x),e:toISO(x),label:fmtDT(x,{day:'2-digit',month:'2-digit'}),full:fmtDate(toISO(x))})}
    else{let x=parseISO(ui.rde.slice(0,8)+'01');while(toISO(x)<=ui.rate){const e=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)),s=toISO(x)<ui.rde?ui.rde:toISO(x),ee=toISO(e)>ui.rate?ui.rate:toISO(e);b.push({s,e:ee,label:fmtDT(x,{month:'short',year:'2-digit'}),full:fmtDT(x,{month:'long',year:'numeric'})});x=addDays(e,1)}}}
  else if(ui.period==='day'){for(let i=13;i>=0;i--){const x=addDays(d,-i);b.push({s:toISO(x),e:toISO(x),label:fmtDT(x,{day:'2-digit',month:'2-digit'}),full:fmtDate(toISO(x)),hl:i===0})}}
  else if(ui.period==='week'){const r=periodRange('week',ui.ref);for(let i=0;i<7;i++){const x=addDays(parseISO(r.s),i);b.push({s:toISO(x),e:toISO(x),label:fmtDT(x,{weekday:'short'}),full:fmtDate(toISO(x))})}}
  else if(ui.period==='month'){const r=periodRange('month',ui.ref);for(let x=parseISO(r.s);toISO(x)<=r.e;x=addDays(x,1))b.push({s:toISO(x),e:toISO(x),label:String(x.getUTCDate()),full:fmtDate(toISO(x))})}
  else{for(let m=0;m<12;m++){const s=new Date(Date.UTC(d.getUTCFullYear(),m,1)),e=new Date(Date.UTC(d.getUTCFullYear(),m+1,0));b.push({s:toISO(s),e:toISO(e),label:fmtDT(s,{month:'short'}),full:fmtDT(s,{month:'long',year:'numeric'})})}}
  return b}

/* ================= GRÁFICOS (HTML/CSS, offline) ================= */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function vbars(items,fmt,fmtAxis,color,lbl){lbl=lbl||fmt;const max=niceMax(Math.max(0,...items.map(i=>i.value)));const step=Math.ceil(items.length/16);
  let grid='';for(let i=0;i<=4;i++){const v=max*i/4;grid+=`<div style="bottom:${i*25}%"><span>${esc(fmtAxis(v))}</span></div>`}
  return `<div class="vchart ${items.length>18?'dense':''}" style="${color?'--vb:'+color:''}"><div class="vgrid">${grid}</div><div class="vbars">${items.map((it,i)=>`<div class="vb ${it.hl?'hl':''}" title="${esc(it.full+': '+fmt(it.value))}">${it.value?`<span class="vb-v">${esc(lbl(it.value))}</span>`:''}<div class="vb-bar" style="height:${(it.value/max*100).toFixed(2)}%"></div><span class="vb-x">${i%step===0?esc(it.label):''}</span></div>`).join('')}</div></div>`}
function hbars(items,fmt,sub,alt){if(!items.length)return `<div class="empty">${esc(t('noData'))}</div>`;const max=Math.max(...items.map(i=>i.value))||1;
  return `<div class="hbars">${items.map(it=>`<div class="hb ${alt?'alt':''}"><div class="hb-label" title="${esc(it.label)}">${esc(it.label)}</div><div class="hb-track"><div class="hb-fill" style="width:${(it.value/max*100).toFixed(1)}%"></div></div><div class="hb-val">${esc(fmt(it.value))}${sub?`<small>${esc(sub(it))}</small>`:''}</div></div>`).join('')}</div>`}
function groupBy(list,keyFn){const m=new Map();for(const o of list){const k=keyFn(o);const g=m.get(k)||{key:k,occ:0,ng:0,cost:0};g.occ++;g.ng+=o.qty;g.cost+=+o.totalCost||0;m.set(k,g)}return [...m.values()]}
/* Sequência de erros: dias de produção seguidos (dias com alguma ocorrência no período)
   em que o mesmo operador teve ocorrência. Dias sem nenhuma ocorrência não quebram a sequência. */
function streaks(list){const days=[...new Set(list.map(o=>o.date))].sort(),ix={},by={};days.forEach((d,i)=>ix[d]=i);
  list.forEach(o=>{const v=String(o.operator||'').trim();if(!v)return;const k=v.toLowerCase(),p=by[k]||(by[k]={name:v,days:{}}),x=p.days[o.date]||(p.days[o.date]={n:0,q:0});x.n++;x.q+=o.qty});
  return Object.values(by).map(p=>{let best=null,cur=null;Object.keys(p.days).sort().forEach(d=>{const x=p.days[d];if(cur&&ix[d]===ix[cur.e]+1){cur.e=d;cur.len++;cur.n+=x.n;cur.q+=x.q}else cur={s:d,e:d,len:1,n:x.n,q:x.q};if(!best||cur.len>best.len||(cur.len===best.len&&cur.n>best.n))best=Object.assign({},cur)});return Object.assign(best,{name:p.name,total:Object.keys(p.days).length})}).sort((a,b)=>b.len-a.len||b.n-a.n||a.name.localeCompare(b.name))}

     <div class="hint" style="grid-column:1/-1">${esc(t('photoHint'))}</div>

  const f=$('#occForm');

  };

const weekOfMonth=d=>Math.min(4,Math.ceil(+String(d).slice(8,10)/7));
function weekRange(y,m,w){const last=new Date(Date.UTC(y,m,0)).getUTCDate(),a=(w-1)*7+1,b=w===4?last:w*7;return {s:`${y}-${pad(m)}-${pad(a)}`,e:`${y}-${pad(m)}-${pad(b)}`}}
function histFiltered(){const h=ui.hist,q=h.q.trim().toLowerCase();

    &&(!q||[o.seq,o.code,o.model,o.client,o.problem,o.operator,o.clientDesc,o.notes,o.destination,o.createdBy,respLabel(o.costResp)].join(' ').toLowerCase().includes(q)))
   .sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq)}

    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint32(14,c,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,nm.length,true);hd.set(nm,30);parts.push(hd,d);
    const ch=new Uint8Array(46+nm.length),w=new DataView(ch.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint32(16,c,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,nm.length,true);w.setUint32(42,off,true);ch.set(nm,46);cd.push(ch);off+=hd.length+d.length});
  const size=cd.reduce((s,x)=>s+x.length,0),e=new Uint8Array(22),ev=new DataView(e.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,size,true);ev.setUint32(16,off,true);
  return new Blob([...parts,...cd,e],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

      if(typeof o.v==='number')return `<c r="${ref}"${st}><v>${o.v}</v></c>`;if(o.d){const n=Math.round(Date.parse(o.v+'T00:00:00Z')/864e5)+25569;return `<c r="${ref}"${st}><v>${n}</v></c>`}

    ['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],

/* ================= DADOS & BACKUP =================
   Online: limites do plano grátis do Supabase (500 MB de banco, 1 GB de fotos), divididos com o QC.
   Offline: o limite é o espaço que o navegador libera neste computador. */
const fmtB=b=>{b=+b||0;return b>=1073741824?(b/1073741824).toFixed(2)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB'};
const DB_LIM=524288000,PH_LIM=1073741824,PH_DEFAULT=150*1024,REC_DEFAULT=2048,WARN_AT=.8;
async function dataUsage(){const refs={product:0,defect:0,scale:0},inl={n:0,b:0},demo={n:0,b:0};let refN=0,recPh=0;
  state.occurrences.forEach(o=>{(o.photos||[]).forEach(p=>{refN++;refs[p.kind]=(refs[p.kind]||0)+1;if(!p.path){const b=Math.round((p.data||'').length*.75);inl.n++;inl.b+=b;if(/^demo-/.test(p.name||'')){demo.n++;demo.b+=b}}});if((o.photos||[]).length)recPh++});
  const u={recs:state.occurrences.length,refN,refs,recPh,demo,em:new Date()};
  if(ONLINE){const r=await sb.rpc('seg_uso');if(r.error)throw r.error;const d=r.data;
    Object.assign(u,{docs:+d.docs,dbUsed:+d.banco_bytes,dbLim:DB_LIM,segBytes:+d.seg_bytes,phSent:+d.fotos_seg_n+inl.n,phBytes:+d.fotos_seg_bytes+inl.b,phUsed:+d.storage_bytes+inl.b,phLim:PH_LIM})}
  else{let q=0,used=0;try{const e=await navigator.storage.estimate();q=e.quota||0;used=e.usage||0}catch(e){}
    const txt=new Blob([JSON.stringify(state)]).size,seg=Math.max(0,txt-inl.b);
    Object.assign(u,{docs:u.recs+state.products.length+state.costs.length,dbUsed:Math.max(used,txt),dbLim:q||DB_LIM,segBytes:seg,phSent:inl.n,phBytes:inl.b,phUsed:Math.max(used,txt),phLim:q||PH_LIM})}
  return u}
function renderData(){const v=$('#view');if(!ui.usage||(ui.usage.em&&Date.now()-ui.usage.em>6e4)){ui.usage={loading:true};dataUsage().then(u=>{ui.usage=u}).catch(e=>{console.warn(e);ui.usage={err:true}}).then(()=>{if(route().name==='data')renderData()})}
  if(ui.usage.loading){v.innerHTML=`<div class="card empty">${esc(t('dataCalc'))}</div>`;return}
  const u=ui.usage;if(u.err){v.innerHTML=`<div class="card empty">${esc(t('dataErr'))}<div style="margin-top:10px"><button class="btn" id="dRef">${esc(t('dataRefresh'))}</button></div></div>`;$('#dRef').onclick=()=>{ui.usage=null;renderData()};return}
  const realN=u.phSent-u.demo.n,avgPh=realN>0?(u.phBytes-u.demo.b)/realN:PH_DEFAULT,avgRec=u.recs?Math.max(256,u.segBytes/u.recs):REC_DEFAULT,perRec=u.recs?u.refN/u.recs:3;
  const dbFree=Math.max(0,u.dbLim-u.dbUsed),phFree=Math.max(0,u.phLim-u.phUsed),fitPh=Math.floor(phFree/avgPh),fitRecDb=Math.floor(dbFree/avgRec),fitRecPh=perRec>0?Math.floor(fitPh/perRec):fitRecDb,fitRec=Math.min(fitRecDb,fitRecPh);
  const toFree=Math.max(0,u.dbUsed-u.dbLim*WARN_AT)+(ONLINE?Math.max(0,u.phUsed-u.phLim*WARN_AT):0);
  const from=addDays(parseISO(todayISO()),-90),last=state.occurrences.filter(o=>o.date>=toISO(from)).length,perMonth=last/3,months=perMonth>0?Math.floor(fitRec/perMonth):null;
  const box=(l,val,sub,c)=>`<div class="card kpi vivid ${c}"><div class="lbl">${esc(l)}</div><div class="val">${esc(val)}</div><div class="sub">${esc(sub||'')}</div></div>`;
  const bar=(l,used,lim)=>{const p=lim?used/lim*100:0,c=p<70?'#10b981':p<90?'#f59e0b':'#ef4444';return `<div style="display:flex;justify-content:space-between;font-size:13px;margin:12px 0 6px"><span>${esc(l)}: <b>${fmtB(used)}</b> / ${fmtB(lim)}</span><span class="note">${(p<.1?p.toFixed(2):p.toFixed(1)).replace('.',',')}%</span></div><div style="height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--border);overflow:hidden"><div style="width:${Math.min(100,p).toFixed(2)}%;min-width:4px;height:100%;background:${c}"></div></div>`};

  $$('[data-seeocc]').forEach(b=>b.onclick=()=>showDetail(b.dataset.seeocc))}
function exportReport(){const R=ui.lastRep;if(!R)return;const a=R.a,rows=[[R.title],[t('date'),fmtDate(R.s)+' – '+fmtDate(R.e)],[t('kpiNg'),a.ng],[t('totalCost'),dec2(a.cost)],[t('kpiOcc'),a.n],[t('kNoCost'),a.noCost],[],[t('period'),t('date'),t('kpiNg'),t('totalCost'),t('kpiOcc'),t('kNoCost')]];
  R.segs.forEach(x=>rows.push([x.sg.label,fmtDate(x.sg.s)+' – '+fmtDate(x.sg.e),x.a.ng,dec2(x.a.cost),x.a.n,x.a.noCost]));
  rows.push([],[t('byCode'),t('kpiNg'),t('totalCost'),t('kpiOcc')]);R.byCode.forEach(x=>rows.push([x.k,x.ng,dec2(x.cost),x.n]));
  rows.push([],[t('byModel'),t('kpiNg'),t('totalCost'),t('kpiOcc')]);R.byModel.forEach(x=>rows.push([x.k,x.ng,dec2(x.cost),x.n]));
  rows.push([],[t('idNo'),t('date'),t('clientOrigin'),t('code'),t('model'),t('qtyNg'),t('unitCost'),t('totalCost'),t('vigFrom')]);R.list.slice().sort((x,y)=>x.date<y.date?-1:1).forEach(o=>rows.push([o.seq,o.date,o.client,o.code,o.model,o.qty,dec2(o.unitCost),dec2(o.totalCost),o.costFrom||'']));
  csvDownload('segregados-custos-'+R.s+'-'+R.e+'.csv',rows)}

/* ---------- relatórios ---------- */
function costReports(){const cr=ui.cr||(ui.cr={rtype:'month',rref:todayISO(),rde:'',rate:'',rcode:'',rmodel:''}),ty=cr.rtype,ref=cr.rref||todayISO();
  const codes=[...new Set(state.costs.map(c=>c.code).concat(state.occurrences.map(o=>normCode(o.code))))].sort(),models=[...new Set(state.occurrences.map(o=>o.model).filter(Boolean))].sort();
  let h=`<div class="card no-print" style="margin-bottom:16px"><div class="toolbar" style="margin:0"><select data-c="rtype">${[['week','periodWeek'],['month','periodMonth'],['year','periodYear'],['range','periodRange']].map(([v,l])=>`<option value="${v}" ${ty===v?'selected':''}>${esc(t(l))}</option>`).join('')}</select>${ty==='range'?`<label class="note">${esc(t('from'))} <input type="date" data-c="rde" value="${esc(cr.rde)}"></label><label class="note">${esc(t('to'))} <input type="date" data-c="rate" value="${esc(cr.rate)}"></label>`:`<label class="note">${esc(t('refDate'))} <input type="date" data-c="rref" value="${esc(ref)}"></label>`}<input type="text" data-c="rcode" list="dlCodes" placeholder="${esc(t('code'))}: ${esc(t('all'))}" value="${esc(cr.rcode)}"><input type="text" data-c="rmodel" list="dlModels" placeholder="${esc(t('model'))}: ${esc(t('all'))}" value="${esc(cr.rmodel)}"></div><datalist id="dlCodes">${codes.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="dlModels">${models.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>`;
  let s,e,ps=null,pe=null,gran,prevTxt;const r0=parseISO(ref);
  if(ty==='week'){const m=addDays(r0,-((r0.getUTCDay()+6)%7));s=toISO(m);e=toISO(addDays(m,6));ps=toISO(addDays(m,-7));pe=toISO(addDays(m,-1));gran='day';prevTxt=t('prevWeek')}
  else if(ty==='year'){s=ref.slice(0,4)+'-01-01';e=ref.slice(0,4)+'-12-31';ps=(+ref.slice(0,4)-1)+'-01-01';pe=(+ref.slice(0,4)-1)+'-12-31';gran='month';prevTxt=t('prevYear')}
  else if(ty==='range'){if(!cr.rde||!cr.rate||cr.rde>cr.rate)return h+`<div class="card empty">${esc(t('rangeAsk'))}</div>`;s=cr.rde;e=cr.rate;const n=Math.round((parseISO(e)-parseISO(s))/864e5)+1;pe=toISO(addDays(parseISO(s),-1));ps=toISO(addDays(parseISO(s),-n));gran=n<=31?'day':n<=120?'week':'month';prevTxt=t('prevRange')+' ('+fmtDate(ps)+' – '+fmtDate(pe)+')'}
  else{s=ref.slice(0,8)+'01';e=toISO(new Date(Date.UTC(+ref.slice(0,4),+ref.slice(5,7),0)));const pm=new Date(Date.UTC(+ref.slice(0,4),+ref.slice(5,7)-2,1));ps=toISO(pm);pe=toISO(addDays(parseISO(s),-1));gran='week';prevTxt=t('prevMonth')}
  const fc=normCode(cr.rcode),fm=plain(cr.rmodel),flt=l=>l.filter(o=>(!fc||normCode(o.code)===fc)&&(!fm||plain(o.model).includes(fm))),cur=flt(state.occurrences.filter(o=>o.date>=s&&o.date<=e)),prev=flt(state.occurrences.filter(o=>o.date>=ps&&o.date<=pe));
  h+=`<p class="note" style="margin-bottom:10px">${esc(t('repRange',{a:fmtDate(s),b:fmtDate(e)}))}${fc?' · '+esc(t('code'))+' '+esc(fc):''}${fm?' · '+esc(t('model'))+' "'+esc(cr.rmodel)+'"':''}</p>`;
  h+=reportBody(cur,{s,e,gran,title:t('repTitle',{a:fmtDate(s),b:fmtDate(e)}),segTitle:t({day:'perDay',week:'perWeek',month:'perMonth'}[gran]),totTxt:t('periodTotal'),prev:agg(prev),prevTxt});
  const top=reportTop(cur);return h+top}
function reportTop(list){const m={};list.forEach(o=>{if(!hasCost(o))return;const k=o.model||'—';m[k]=(m[k]||0)+(+o.totalCost||0)});const rows=Object.entries(m).map(([label,value])=>({label,value:round2(value)})).sort((a,b)=>b.value-a.value).slice(0,10);
  return `<div class="card" style="margin-bottom:16px"><h3>${esc(t('topLoss'))}</h3>${hbars(rows,fmtMoney,null,true)}</div>`}
async function costAct(a,arg){
  if(a==='impCancel'){ui.ci=null;renderCosts()}
  else if(a==='impConfirm')confirmImport();
  else if(a==='tpl')downloadTemplate();
  else if(a==='fix')fixModal(arg);
  else if(a==='hAll'){ui.hall=true;renderCosts()}
  else if(a==='see')seeRecords(arg);
  else if(a==='exp')exportReport();
  else if(a==='print')window.print();
  else if(a==='closeM'){const R=ui.lastRep;if(!R||!canEdit())return;const yy=+arg.slice(0,4),mm=+arg.slice(5,7),miss=[1,2,3,4].filter(w=>!weekLaunched(yy,mm,w));if(miss.length&&!await askYes(t('weeksMissing',{w:miss.map(w=>t('weekOfMonth',{n:w})).join(', ')})))return;if(!await askYes(t('mCloseAsk',{m:ymLabel(arg),n:fmtNum(R.a.n),q:fmtNum(R.a.ng),c:fmtMoney(R.a.cost)})+(R.a.noCost?'\n\n'+t('noCostWarn',{n:R.a.noCost,q:R.a.ngNoCost}):'')))return;
    const at=new Date().toISOString(),tot={n:R.a.n,ng:R.a.ng,cost:R.a.cost,noCost:R.a.noCost};state.closures[arg]={status:'closed',totals:tot,by:currentUser.name,at};state.closureLog.unshift({id:uid(),per:arg,act:'close',user:currentUser.name,at,totals:tot});await persist();toast(t('savedOk'));renderCosts()}
  else if(a==='reopen'){if(!isAdmin())return;const why=await askText(t('reopenAsk'));if(why===null)return;if(!why.trim()){toast(t('reasonReq'),true);return}const at=new Date().toISOString();Object.assign(state.closures[arg],{status:'open',by:currentUser.name,at});state.closureLog.unshift({id:uid(),per:arg,act:'reopen',user:currentUser.name,at,reason:why.trim()});await persist();toast(t('savedOk'));renderCosts()}
  else if(a==='fillRange'){const [s,e]=arg.split('|'),l=state.occurrences.filter(o=>o.date>=s&&o.date<=e&&!hasCost(o)&&!occLocked(o.date));let n=0;
    if(!await askYes(t('fillAsk',{a:fmtDate(s),b:fmtDate(e)})))return;
    l.forEach(o=>{const c=costAt(o.code,o.date);if(c){applyPrice(c,[o]);n++}});if(n)logCost({type:'fill',code:'*',from:s,count:n,reason:t('reasonFill')});await persist();toast(t('fillDone',{n}));renderCosts()}}

/* ================= INICIALIZAÇÃO ================= */
(async function init(){
  LANG=I18N[ls.get('seg_lang')]?ls.get('seg_lang'):'pt-BR';
  if(ONLINE){applyLang(LANG);await cloudInit();return}
  try{await Store.open();state=await Store.get('state')}catch(e){storageOK=false}
  if(!state||!Array.isArray(state.occurrences)){state=buildDemoState();await persist()}
  else if((state.version||1)<3||!Array.isArray(state.costs)||!state.weekDone){state=migrate(state);await persist()}
  if(state.settings)state.settings.requireScalePhoto=false;
  applyLang(LANG);
  if(!storageOK){$('#loginErr').textContent=t('storageError')}
  const sid=ss.get('seg_user');const u=sid&&state.users.find(x=>x.id===sid);
  if(u){currentUser=u;enterApp()}
})();
</script>
